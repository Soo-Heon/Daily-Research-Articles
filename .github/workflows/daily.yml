name: Daily Research Articles

on:
  schedule:
    # 한국시간(KST = UTC+9) 매일 오전 8시 = UTC 전날 23:00
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: '며칠 전부터 검색할지 (디폴트 1)'
        required: false
        default: '1'
      send_email:
        description: '이메일 발송 여부 (true/false)'
        required: false
        default: 'true'
      test_email_only:
        description: 'PubMed 건너뛰고 이메일 발송 테스트만 (true/false)'
        required: false
        default: 'false'

# archive/ 폴더 커밋용
permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------- #
      # 1단계: SMTP 연결/인증만 매일 검증.
      # 실제 메일은 보내지 않음. 디버깅 시 test_email_only=true 로
      # 수동 실행하면 TEST 메일 1통이 발송됩니다.
      # ----------------------------------------------------------- #
      - name: 🧪 Test email sending
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO || secrets.GMAIL_USER }}
          TEST_SEND_EMAIL: ${{ github.event.inputs.test_email_only || 'false' }}
        run: python scripts/test_email.py

      # ----------------------------------------------------------- #
      # 2단계: 메인 워크플로우 (PubMed → Claude → Archive → Email)
      # test_email_only=true 일 때는 건너뜀
      # ----------------------------------------------------------- #
      - name: 🚀 Run daily research
        if: ${{ github.event.inputs.test_email_only != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO || secrets.GMAIL_USER }}
          DAYS_BACK: ${{ github.event.inputs.days_back || '1' }}
          SEND_EMAIL: ${{ github.event.inputs.send_email || 'true' }}
        run: python scripts/run_daily.py

      # ----------------------------------------------------------- #
      # 3단계: archive 커밋 (성공/실패 무관하게)
      # ----------------------------------------------------------- #
      - name: 📦 Commit archive
        if: always() && github.event.inputs.test_email_only != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/ || true
          if git diff --staged --quiet; then
            echo "변경된 파일 없음"
          else
            git commit -m "archive: $(date -u +%Y-%m-%d)"
            git push
          fi

      # ----------------------------------------------------------- #
      # 4단계: 로그 아티팩트 업로드 (디버깅용)
      # ----------------------------------------------------------- #
      - name: 📋 Upload archive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ github.run_id }}
          path: archive/
          retention-days: 14
          if-no-files-found: ignore
